server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  # S114 (L0a, #151) -- configuration d'execution, jamais mise en cache.
  location = /config.js { add_header Cache-Control "no-store"; try_files $uri =404; }
  location /health { return 200 '{"status":"ok"}'; add_header Content-Type application/json; }
}
